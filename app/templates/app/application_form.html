<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おすすめスポット登録</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
            text-align: center;
        }

        form {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        form label {
            font-weight: bold;
        }

        form input, form select, form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #b0deec;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        button[type="submit"]:hover {
            background-color: #b0deec;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>おすすめスポット登録</h2>
        
        <!-- 登録成功メッセージ -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form action="{% url 'add_spot' applicant_id=applicant_id %}" method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">スポット名</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="address">住所</label>
                <input type="text" class="form-control" id="address" name="address" required>
            </div>

            <div class="form-group">
                <label for="category">カテゴリー</label>
                <select class="form-control" id="category" name="category" required>
                    <option value="" disabled selected>カテゴリーを選択</option>
                    <option value="自然・アウトドア">自然・アウトドア</option>
                    <option value="歴史・文化">歴史・文化</option>
                    <option value="グルメ">グルメ</option>
                    <option value="エンタメ・レジャー">エンタメ・レジャー</option>
                    <option value="ショッピング">ショッピング</option>
                    <option value="リラックス・癒し">リラックス・癒し</option>
                    <option value="夜景・デートスポット">夜景・デートスポット</option>
                    <option value="ファミリー・子ども向け">ファミリー・子ども向け</option>
                    <option value="ドライブ・交通">ドライブ・交通</option>
                    <option value="珍スポット・マニア向け">珍スポット・マニア向け</option>
                    <option value="その他">その他</option>
                </select>
            </div>

            <div class="form-group">
                <label for="opening_hours">営業時間</label>
                <input type="text" class="form-control" id="opening_hours" name="opening_hours" placeholder="例: 9:00-18:00">
            </div>

            <div class="form-group">
                <label for="price">料金</label>
                <input type="text" class="form-control" id="price" name="price" placeholder="例: 無料、1000円">
            </div>

            <div class="form-group">
                <label for="rating">評価</label>
                <select class="form-control" id="rating" name="rating" required>
                    <option value="1.0">1</option>
                    <option value="1.5">1.5</option>
                    <option value="2.0">2</option>
                    <option value="2.5">2.5</option>
                    <option value="3.0">3</option>
                    <option value="3.5">3.5</option>
                    <option value="4.0">4</option>
                    <option value="4.5">4.5</option>
                    <option value="5.0">5</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">補足</label>
                <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">内容確認する</button>
        </form>

        <a href="{% url 'home' %}" class="btn btn-secondary mt-3">ホームに戻る</a>
    </div>
</body>
</html>
