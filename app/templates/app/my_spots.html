<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おすすめスポット一覧</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      max-width: 800px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }
    table {
      background-color: #fff;
    }
    th, td {
      text-align: center;
    }
    .btn-sm {
      margin: 2px;
    }
  </style>
</head>
<body>
  <h1 class="text-center mb-4">おすすめスポット一覧</h1>
  <div class="container">
    <div class="row justify-content-center">
      <div>
        {% if messages %}
          <div class="alert alert-info">
            {% for message in messages %}
              <p>{{ message }}</p>
            {% endfor %}
          </div>
        {% endif %}
      </div>

      <div class="tab-content mt-4" id="mySpotsTabsContent">
        <div class="tab-pane fade show active" id="spots" role="tabpanel" aria-labelledby="spots-tab">
          <table class="table table-bordered table-hover">
            <thead class="thead-light">
              <tr>
                <th>スポット名</th>
                <th>詳細</th>
                <th>評価</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              {% for spot in spots %}
              <tr>
                <td>{{ spot.name }}</td>
                <td>{{ spot.description }}</td>
                <td>{{ spot.rating }}</td>
                <td>
                  <a href="{% url 'edit_spot' spot.id %}" class="btn btn-warning btn-sm">編集</a>
                  <form method="POST" action="{% url 'delete_spot' spot.id %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-sm">削除</button>
                  </form>
                </td>
              </tr>
              {% empty %}
              <tr>
                <td colspan="4">現在登録されているおすすめスポットはありません。</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
          <a href="{% url 'home' %}" class="btn btn-primary">ホームに戻る</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
